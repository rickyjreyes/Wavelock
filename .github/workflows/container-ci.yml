name: Container and core CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[blake3]" pytest
      - name: Run fast core tests
        run: python -m pytest tests/ -m "not slow" -q
      - name: Reproduce bounty submissions and evidence
        run: |
          python -c "import platform,sys,numpy; print(platform.platform(), sys.version, 'NumPy', numpy.__version__)"
          python audit/run_bounty_contract.py --check
      - name: Smoke-test installed commands
        run: |
          wavelock-cli --help
          wavelock-ots --help
          wavelock-encrypt --help
          wavelockd --help
          wavelock-miner --help
      - name: Exercise supported OTS workflow
        run: python hello_wavelock.py

  container:
    runs-on: ubuntu-24.04
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build --quiet --tag wavelock-ci .
      - name: Smoke-test image commands
        id: container_smoke
        shell: bash
        run: |
          set +e
          status=0
          {
            echo "== wavelock-cli =="
            docker run --rm wavelock-ci wavelock-cli --help || status=$?
            echo "== wavelock-ots =="
            docker run --rm wavelock-ci wavelock-ots --help || status=$?
          } > container-smoke.log 2>&1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 250 container-smoke.log
          exit 0
      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wavelock-container-smoke-${{ github.sha }}
          if-no-files-found: error
          path: container-smoke.log
      - name: Enforce container smoke result
        run: test "${{ steps.container_smoke.outputs.status }}" -eq 0
