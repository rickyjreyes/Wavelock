name: WaveLock Lean verification

on:
  push:
    branches:
      - master
      - 'formal/**'
    paths:
      - 'lean/**'
      - '.github/workflows/lean-proof.yml'
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/lean-proof.yml'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof placeholders and new axioms
        shell: bash
        run: |
          if grep -R -nE '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)' lean --include='*.lean'; then
            echo 'Proof placeholders or axioms are prohibited'
            exit 1
          fi
      - name: Initialize pinned Lean toolchain and Mathlib manifest
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.23.0
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean
          lake update
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
          build: true
          test: false
          lint: false
      - name: Strict declaration and axiom audit
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean
          lake env lean scripts/AxiomAudit.lean | tee "$RUNNER_TEMP/axiom-audit.txt"
          diff -u axiom_audit_receipt.txt "$RUNNER_TEMP/axiom-audit.txt"
      - name: Audit negative control (sorryAx and native_decide must be flagged)
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean
          lake env lean scripts/AxiomAuditNegativeControl.lean
      - name: Bounded model check of the RCA model (receipt)
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean
          lake env lean scripts/RCAModelCheck.lean > "$RUNNER_TEMP/rca-model-check.txt" 2>&1
          diff -u rca_model_check_receipt.txt "$RUNNER_TEMP/rca-model-check.txt"
